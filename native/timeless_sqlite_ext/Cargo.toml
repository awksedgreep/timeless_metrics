[package]
name = "timeless_sqlite_ext"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
rusqlite = { version = "0.40.1", features = ["vtab", "loadable_extension"] }
timeless-ext = { git = "https://github.com/awksedgreep/timeless-libsql.git", tag = "v0.6.2", default-features = false }
