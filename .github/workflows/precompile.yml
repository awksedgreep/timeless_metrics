name: Precompile NIFs

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.target }} (${{ matrix.otp && format('OTP {0}', matrix.otp) || 'brew' }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # OTP 27 builds produce NIF 2.17 artifacts (OTP 26-28 consumers);
          # OTP 29 builds produce NIF 2.18 artifacts. macOS uses brew
          # (currently OTP 29 -> NIF 2.18).
          - target: x86_64-linux-gnu
            rust_target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            otp: "27"
            elixir: "1.19"
          - target: x86_64-linux-gnu
            rust_target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            otp: "29"
            elixir: "1.20"
          - target: aarch64-linux-gnu
            rust_target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            otp: "27"
            elixir: "1.19"
          - target: aarch64-linux-gnu
            rust_target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            otp: "29"
            elixir: "1.20"
          - target: aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
            runner: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Normalize setup-beam runner image (Linux ARM)
        if: matrix.runner == 'ubuntu-24.04-arm'
        run: echo "ImageOS=ubuntu24" >> "$GITHUB_ENV"

      - name: Install Erlang & Elixir (Linux)
        if: runner.os == 'Linux'
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Install Erlang & Elixir (macOS)
        if: runner.os == 'macOS'
        run: |
          brew trust aws/tap || true
          brew install erlang elixir
          mix local.hex --force
          mix local.rebar --force

      - name: Install cross-compile toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Fetch dependencies
        run: mix deps.get

      - name: Precompile
        run: mix elixir_make.precompile
        env:
          CC_PRECOMPILER_CURRENT_TARGET: ${{ matrix.target }}
          RUST_TARGET: ${{ matrix.rust_target }}
          ELIXIR_MAKE_CACHE_DIR: ${{ github.workspace }}/cache

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: nif-${{ matrix.target }}-${{ matrix.otp || 'brew' }}
          path: cache/*.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Erlang & Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.19"

      - name: Fetch dependencies
        run: mix deps.get

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: nif-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz

      - name: Generate checksums
        run: mix elixir_make.checksum --all --ignore-unavailable
        env:
          ELIXIR_MAKE_CACHE_DIR: ${{ github.workspace }}/artifacts

      - name: Commit checksum.exs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp checksum.exs /tmp/checksum.exs
          git fetch origin main
          git checkout -f -B main origin/main
          cp /tmp/checksum.exs checksum.exs
          git add checksum.exs
          git diff --cached --quiet || git commit -m "Update checksum.exs for ${GITHUB_REF_NAME}"
          git push

      - name: Publish to Hex
        run: mix hex.publish --yes --replace
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
