name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        otp: ["28.0"]
        elixir: ["1.19"]

    steps:
      - uses: actions/checkout@v4

      - name: Check out timeless-libsql extension
        uses: actions/checkout@v4
        with:
          repository: awksedgreep/timeless-libsql
          ref: a72634e3aa2d523b468acdb0aac2870d5c5e5b31
          path: timeless-libsql

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Build timeless-libsql extension
        working-directory: timeless-libsql
        run: |
          cargo build --locked --release -p timeless-ext
          mkdir -p ../../timeless-libsql/target/release
          cp target/release/libtimeless_ext.so ../../timeless-libsql/target/release/libtimeless_ext.so

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test --max-cases 4 --exclude integration

      - name: Check formatting
        run: mix format --check-formatted
